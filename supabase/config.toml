project_id = "torquex"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = []
enable_signup = false

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false

[functions.create-invitation]
verify_jwt = true

[functions.accept-invitation]
verify_jwt = false

[functions.app-state]
verify_jwt = true
